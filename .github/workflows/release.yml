name: Release

# Tag-only release: build/package Windows x64 and ARM64 installers.
# The git tag is the release version source of truth. Before packaging, the
# workflow synchronizes package.json, Tauri config, and Cargo metadata to it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            name: x64
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.rust_target }}

      - name: Sync app version from release tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' is not a supported semantic version tag such as v0.1.5"
          }
          $version = $Matches[1]
          Write-Host "Building Quay $version from tag $tag"

          $packagePath = "package.json"
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 100 | Set-Content $packagePath -Encoding utf8

          $tauriPath = "src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content $tauriPath -Encoding utf8

          $cargoPath = "src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^(version\s*=\s*")[^"]+("\s*)$', "`${1}$version`${2}"
          Set-Content $cargoPath $cargo -Encoding utf8

          $packageCheck = (Get-Content $packagePath -Raw | ConvertFrom-Json).version
          $tauriCheck = (Get-Content $tauriPath -Raw | ConvertFrom-Json).version
          $cargoCheck = if ((Get-Content $cargoPath -Raw) -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] } else { '' }
          if ($packageCheck -ne $version -or $tauriCheck -ne $version -or $cargoCheck -ne $version) {
            throw "Version sync failed: package=$packageCheck tauri=$tauriCheck cargo=$cargoCheck expected=$version"
          }

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quay ${{ github.ref_name }}
          releaseBody: |
            Windows installers for [Quay](https://github.com/dhhieu113pro/quay) — x64 and ARM64 (Snapdragon / Copilot+).

            Quay uses the installed `wslc.exe` directly with the default WSLC session.
            Requires WSL **2.9.3+** (`wsl --update --pre-release`) and `wslc.exe` on PATH.

            | Asset | Machine |
            | --- | --- |
            | `Quay_*_x64-setup.exe` | Intel / AMD. Silent: `/S` |
            | `Quay_*_arm64-setup.exe` | ARM64. Silent: `/S` |
            | `Quay_*_x64_en-US.msi` / `Quay_*_arm64_en-US.msi` | MSI. Silent: `msiexec /i … /quiet` |

            Close hides to the tray. Quit from the tray menu.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.rust_target }} --bundles nsis,msi

      - name: Stage MSI for installer repository
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI bundle was not produced" }
          New-Item -ItemType Directory -Force -Path installer-artifact | Out-Null
          Copy-Item $msi.FullName "installer-artifact/$($msi.Name)"
          Write-Host "Staged $($msi.Name)"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-msi-${{ matrix.name }}
          path: installer-artifact/*.msi
          if-no-files-found: error
          retention-days: 7

  publish-store-msi:
    name: Publish Store MSI files
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: store-msi-*
          path: installers
          merge-multiple: true

      - name: Publish to quay-installer
        env:
          INSTALLER_TOKEN: ${{ secrets.QUAY_INSTALLER_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${INSTALLER_TOKEN:-}" ]; then
            echo "Missing QUAY_INSTALLER_TOKEN repository secret"
            exit 1
          fi

          shopt -s nullglob
          files=(installers/*.msi)
          if [ ${#files[@]} -ne 2 ]; then
            echo "Expected 2 MSI files, found ${#files[@]}"
            find installers -maxdepth 2 -type f -print
            exit 1
          fi

          git clone "https://x-access-token:${INSTALLER_TOKEN}@github.com/dhhieu113pro/quay-installer.git" installer-repo
          mkdir -p "installer-repo/${RELEASE_TAG}"
          cp installers/*.msi "installer-repo/${RELEASE_TAG}/"

          cd installer-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RELEASE_TAG}"
          if git diff --cached --quiet; then
            echo "Installer files already published for ${RELEASE_TAG}"
            exit 0
          fi
          git commit -m "Publish Quay ${RELEASE_TAG} installers"
          git push origin main

      - name: Show Microsoft Store URLs
        shell: bash
        run: |
          echo "Published installer URLs:"
          find installers -maxdepth 1 -type f -name '*.msi' -printf 'https://raw.githubusercontent.com/dhhieu113pro/quay-installer/main/${{ github.ref_name }}/%f\n'
