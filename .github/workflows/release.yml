name: Release

# Only tags. CI already proved the same matrix on the commit you tagged.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sdk_rid: win-x64
            name: x64
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            sdk_rid: win-arm64
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.rust_target }}

      - name: Install frontend
        run: npm ci

      - name: Stage Microsoft native WSLC SDK
        shell: pwsh
        run: ./scripts/prepare-wslc-sdk.ps1 -Rid ${{ matrix.sdk_rid }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quay ${{ github.ref_name }}
          releaseBody: |
            Windows installers for [Quay](https://github.com/dhhieu113pro/quay) — x64 and ARM64 (Snapdragon / Copilot+).

            Needs WSL **2.9.3+** (`wsl --update --pre-release`) and `wslc.exe` on PATH.

            | Asset | Machine |
            | --- | --- |
            | `Quay_*_x64-setup.exe` | Intel / AMD. Silent: `/S` |
            | `Quay_*_arm64-setup.exe` | ARM64. Silent: `/S` |
            | `Quay_*_x64_en-US.msi` / `Quay_*_arm64_en-US.msi` | MSI. Silent: `msiexec /i … /quiet` |

            Close hides to the tray. Quit from the tray menu.

            Microsoft Store uses the same NSIS build with silent flag `/S`. See `docs/store.md`.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.rust_target }} --bundles nsis,msi
