name: Finalize 0.1.4 metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-014.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update generated metadata and edge cases
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('package-lock.json')
          text = p.read_text()
          text = text.replace('"version": "0.1.3"', '"version": "0.1.4"', 2)
          p.write_text(text)

          p = Path('src-tauri/Cargo.lock')
          text = p.read_text()
          old = 'name = "quay"\nversion = "0.1.3"'
          if old not in text:
              raise SystemExit('quay Cargo.lock entry not found')
          p.write_text(text.replace(old, 'name = "quay"\nversion = "0.1.4"', 1))

          p = Path('src/lib/wslc/store.ts')
          text = p.read_text()
          text = text.replace(
              'if (!container || container.status !== "running") return;',
              'if (!container) return;',
              1,
          )
          old = '''  const prepareGroup = async (group: ContainerGroup) => {\n    if (group.id === "local-coding") await ensureHostDirectory(LOCAL_CODING_WORKSPACE);\n  };'''
          new = '''  const prepareGroup = async (group: ContainerGroup) => {\n    if (group.id !== "local-coding") return;\n    const spec = group.specs.find((item) => item.name === "local-coding-mcp");\n    const mount = spec?.mounts\n      .split("\\n")\n      .map((item) => item.trim())\n      .find((item) => item.includes(":/workspace"));\n    const marker = ":/workspace";\n    const at = mount?.lastIndexOf(marker) ?? -1;\n    const workspacePath = at > 0 ? mount!.slice(0, at) : LOCAL_CODING_WORKSPACE;\n    await ensureHostDirectory(workspacePath);\n  };'''
          if old not in text:
              raise SystemExit('prepareGroup block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/components/container-inspect.tsx')
          text = p.read_text()
          old = '''  useEffect(() => {\n    if (container.status !== "running") return;\n    void refreshLogs(container.id);\n    const id = window.setInterval(() => void refreshLogs(container.id), 3000);\n    return () => window.clearInterval(id);\n  }, [container.id, container.status, refreshLogs]);'''
          new = '''  useEffect(() => {\n    void refreshLogs(container.id);\n    if (container.status !== "running") return;\n    const id = window.setInterval(() => void refreshLogs(container.id), 3000);\n    return () => window.clearInterval(id);\n  }, [container.id, container.status, refreshLogs]);'''
          if old not in text:
              raise SystemExit('LogPane effect not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '{container.status === "running" ? "No output yet." : "Start the container to read logs."}',
              '"No output yet."',
              1,
          )
          p.write_text(text)
          PY

      - name: Commit final metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src/lib/wslc/store.ts src/components/container-inspect.tsx
          git commit -m "Finalize Quay 0.1.4 Store metadata"
          git push origin HEAD:main
