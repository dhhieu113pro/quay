name: Create v0.1.3 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v0.1.3-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.1.3
        env:
          TARGET_SHA: 25fb120a41f5c9be56deccb7d448e60cef80c803
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.3" >/dev/null 2>&1; then
            echo "v0.1.3 already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.3 "$TARGET_SHA" -m "Quay v0.1.3"
          git push origin v0.1.3
