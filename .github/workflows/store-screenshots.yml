name: Store Assets

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/shots/*.jpg"
      - "docs/shots/*.jpeg"
      - "docs/logo.png"
      - ".github/workflows/store-screenshots.yml"

permissions:
  contents: write

jobs:
  prepare-store-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Microsoft Store assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          shots = Path("docs/shots")
          out = Path("store/generated")
          out.mkdir(parents=True, exist_ok=True)

          # Screenshots: convert repository JPEGs to PNG and make sure they meet
          # Microsoft's recommended minimum dimensions while preserving ratio.
          files = sorted([*shots.glob("*.jpg"), *shots.glob("*.jpeg")])
          if not files:
              raise SystemExit("No JPEG screenshots found in docs/shots")

          for path in files:
              with Image.open(path) as src:
                  image = src.convert("RGB")
                  w, h = image.size
                  scale = max(1366 / w, 768 / h, 1.0)
                  if scale > 1:
                      image = image.resize(
                          (round(w * scale), round(h * scale)),
                          Image.Resampling.LANCZOS,
                      )
                  target = out / f"screenshot-{path.stem}.png"
                  image.save(target, "PNG", optimize=True)
                  print(f"{target}: {image.width}x{image.height}")

          # Store logo: exact 1080x1080 PNG. Use Quay's existing logo and place
          # it on a clean dark background with safe padding.
          logo_path = Path("docs/logo.png")
          if not logo_path.exists():
              raise SystemExit("docs/logo.png not found")

          with Image.open(logo_path) as src:
              logo = src.convert("RGBA")
              box = Image.new("RGBA", (1080, 1080), (8, 15, 29, 255))
              fitted = ImageOps.contain(logo, (820, 820), Image.Resampling.LANCZOS)
              x = (1080 - fitted.width) // 2
              y = (1080 - fitted.height) // 2
              box.alpha_composite(fitted, (x, y))
              box.convert("RGB").save(out / "store-logo-1080x1080.png", "PNG", optimize=True)

              # Recommended 2:3 poster: exact 720x1080.
              poster = Image.new("RGBA", (720, 1080), (8, 15, 29, 255))
              poster_logo = ImageOps.contain(logo, (560, 560), Image.Resampling.LANCZOS)
              px = (720 - poster_logo.width) // 2
              py = (1080 - poster_logo.height) // 2
              poster.alpha_composite(poster_logo, (px, py))
              poster.convert("RGB").save(out / "store-poster-720x1080.png", "PNG", optimize=True)
          PY

      - name: Verify Microsoft Store requirements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          out = Path("store/generated")
          files = sorted(out.glob("*.png"))
          if not files:
              raise SystemExit("No Store PNG assets generated")

          screenshot_count = len([p for p in files if p.name.startswith("screenshot-")])
          if screenshot_count > 10:
              raise SystemExit(f"Microsoft Store supports up to 10 screenshots; generated {screenshot_count}")

          for path in files:
              size = path.stat().st_size
              if size >= 50 * 1024 * 1024:
                  raise SystemExit(f"{path} is >= 50 MB")
              with Image.open(path) as image:
                  if image.format != "PNG":
                      raise SystemExit(f"{path} is not PNG")
                  dims = image.size

              if path.name == "store-logo-1080x1080.png" and dims != (1080, 1080):
                  raise SystemExit(f"Store logo has wrong dimensions: {dims}")
              if path.name == "store-poster-720x1080.png" and dims != (720, 1080):
                  raise SystemExit(f"Store poster has wrong dimensions: {dims}")
              if path.name.startswith("screenshot-") and dims[0] < 1366 and dims[1] < 768:
                  raise SystemExit(f"Screenshot below recommended dimensions: {path.name}: {dims}")

              print(f"OK: {path.name}: {dims[0]}x{dims[1]}, {size / 1024:.1f} KiB")
          PY

      - name: Save generated assets in repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf store/assets
          mkdir -p store/assets
          cp store/generated/*.png store/assets/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/assets

          if git diff --cached --quiet; then
            echo "Store assets are already up to date."
          else
            git commit -m "Update Microsoft Store assets [skip ci]"
            git push
          fi

      - name: Upload Microsoft Store assets
        uses: actions/upload-artifact@v4
        with:
          name: quay-microsoft-store-assets
          path: store/generated/*.png
          if-no-files-found: error
          retention-days: 30
