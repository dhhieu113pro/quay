name: CI

# GitHub-hosted runners verify source/build/package.
# WSLC runtime coverage is experimental until hosted runner support proves reliable.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            name: x64
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-${{ matrix.rust_target }}

      - name: Prepare pnpm lockfile when missing
        shell: pwsh
        run: |
          if (-not (Test-Path pnpm-lock.yaml)) {
            Write-Host "pnpm-lock.yaml is missing; importing package-lock.json for this CI run"
            pnpm import
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }} --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: quay-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  wslc-integration:
    name: WSLC integration (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show current WSL state
        shell: pwsh
        run: |
          wsl --status
          wsl --version

      - name: Update WSL pre-release
        shell: pwsh
        run: |
          wsl --update --pre-release
          wsl --shutdown
          wsl --version

      - name: Locate WSLC command
        shell: pwsh
        run: |
          $cmd = Get-Command wslc -ErrorAction SilentlyContinue
          if (-not $cmd) {
            $candidates = @(
              "$env:ProgramFiles\WSL\wslc.exe",
              "$env:LOCALAPPDATA\Microsoft\WindowsApps\wslc.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $dir = Split-Path $candidate -Parent
                $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                $cmd = Get-Item $candidate
                break
              }
            }
          }
          if (-not $cmd) {
            $found = Get-ChildItem "$env:ProgramFiles\WSL" -Filter wslc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $cmd = $found
            }
          }
          if (-not $cmd) {
            throw "WSL 2.9.4 installed, but wslc.exe was not found under the known WSL install locations"
          }
          Write-Host "wslc path: $($cmd.FullName ?? $cmd.Source)"
          & $cmd.FullName version

      - name: Run WSLC hello-world
        shell: pwsh
        run: |
          wslc run --rm hello-world

      - name: Inspect WSLC runtime
        if: always()
        shell: pwsh
        run: |
          $cmd = Get-Command wslc -ErrorAction SilentlyContinue
          if ($cmd) {
            wslc container list --all
            wslc image list
          } else {
            Write-Host "wslc is not available; skipping runtime inspection"
          }
