name: CI

# GitHub-hosted runners verify source, Rust WSLC adapter logic, Store submission
# request logic, landing-page behavior, and Windows packaging. The ignored
# real_wslc_container_lifecycle test stays in tests/run-all.ps1 for local Windows
# validation because hosted runners cannot reliably update WSL.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            name: x64
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Store submission tests
        run: pnpm test:store-submission

      - name: Pages tests
        run: pnpm test:pages

      - name: Windows autostart wiring tests
        run: pnpm test:autostart

      - name: TypeScript check
        run: pnpm typecheck

      - name: Rust WSLC adapter tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }} --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: quay-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
          if-no-files-found: error
