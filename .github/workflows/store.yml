name: Microsoft Store package

# Builds the same full-trust Win32 installers intended for Partner Center's
# EXE/MSI app flow. Submission stays manual so the workflow never claims a
# Partner Center upload succeeded when it only built artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            name: x64
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: store-${{ matrix.rust_target }}

      - name: Install frontend
        run: npm ci --legacy-peer-deps

      - name: Verify release version is aligned
        shell: pwsh
        run: |
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $cargo) { throw "Could not read Cargo package version" }
          $cargoVersion = $cargo.Matches[0].Groups[1].Value
          Write-Host "package.json=$package tauri=$tauri cargo=$cargoVersion"
          if ($package -ne $tauri -or $package -ne $cargoVersion) {
            throw "Quay version files are not aligned"
          }

      - name: Bundle Store installers
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles nsis,msi --config src-tauri/tauri.store.conf.json

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path store/out | Out-Null
          Get-ChildItem -Recurse src-tauri/target/${{ matrix.rust_target }}/release/bundle -Include *.exe,*.msi |
            Copy-Item -Destination store/out -Force
          $files = Get-ChildItem store/out
          if (-not $files) { throw "No Store installers were produced" }
          $files | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: quay-microsoft-store-${{ matrix.name }}
          path: store/out/*
          if-no-files-found: error
