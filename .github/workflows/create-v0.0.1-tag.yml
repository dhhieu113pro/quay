name: Create v0.0.1 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v0.0.1-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.0.1
        env:
          TARGET_SHA: e1df7e5235840186c7a8fbf5b0383157e7b85c8e
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v0.0.1" >/dev/null 2>&1; then
            echo "v0.0.1 already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.0.1 "$TARGET_SHA" -m "Quay v0.0.1"
          git push origin v0.0.1
