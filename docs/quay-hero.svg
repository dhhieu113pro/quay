<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Quay — WSL container manager for Windows</title><desc id="desc">Run and manage WSL containers, organize them into stacks, inspect images and logs, use GPU and ports, and auto-start your development environment.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><circle cx="1060" cy="70" r="180" fill="#2563eb" opacity=".08"/><g transform="translate(58 48)"><rect width="74" height="74" rx="20" fill="url(#accent)"/><path d="M19 23 37 13l18 10-18 10-18-10Zm0 13 18 10 18-10v15L37 61 19 51V36Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><text x="96" y="37" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Quay</text><text x="96" y="66" fill="#9fb0c8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Run and manage WSL containers on Windows</text></g><g transform="translate(58 165)" font-family="Segoe UI,Arial,sans-serif"><text fill="#fff" font-size="34" font-weight="700">Your containers. One clean desktop.</text><text y="42" fill="#9fb0c8" font-size="18">Start, stop, inspect, group and monitor containers without living in the CLI.</text></g><g transform="translate(58 260)" font-family="Segoe UI,Arial,sans-serif"><g><rect width="250" height="118" rx="18" fill="#152238"/><text x="20" y="34" fill="#5eead4" font-size="16" font-weight="700">CONTAINERS</text><text x="20" y="62" fill="#fff" font-size="21" font-weight="700">Run &amp; manage</text><text x="20" y="88" fill="#9fb0c8" font-size="15">Ports · env · mounts · GPU</text></g><g transform="translate