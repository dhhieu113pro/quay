[package]
name = "quay"
version = "0.1.0"
description = "A dock for WSL containers"
authors = ["Hieu Dam"]
edition = "2021"
license = "MIT"

[lib]
name = "quay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
